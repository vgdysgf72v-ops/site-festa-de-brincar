name: Importar fotos do site

on:
  push:
    branches: [main]
    paths:
      - "content/photo-import.json"
      - ".github/workflows/import-site-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar fotos originais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/site-photos
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, re, html

          manifest = pathlib.Path("content/photo-import.json")
          data = json.loads(manifest.read_text())
          photos = data.get("photos", [])
          if not photos:
              raise SystemExit("Nenhuma foto para importar.")

          out = pathlib.Path("public/site-photos")

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Festa-de-Brincar-importer/1.0",
                      "Accept": "*/*",
                  },
              )
              return urllib.request.urlopen(req, timeout=90)

          def resolve_and_download(url, target):
              with fetch(url) as r:
                  body = r.read()
                  ctype = (r.headers.get("Content-Type") or "").lower()
                  final_url = r.geturl()

              if ctype.startswith("image/"):
                  target.write_bytes(body)
                  return

              text = body.decode("utf-8", "ignore")
              print("Diagnóstico da página compartilhada:")
              pats = [
                  r'[^"\'<>\\\s]{0,80}(?:api|download|share|file|object)[^"\'<>\\\s]{0,120}',
                  r'/_next/data/[^"\'<>\\\s]+',
              ]
              found_diag = []
              for pat in pats:
                  found_diag.extend(re.findall(pat, text, re.I))
              for x in list(dict.fromkeys(found_diag))[:150]:
                  print("DIAG", html.unescape(x).replace("\\/","/"))

              # Inspeciona o JavaScript da página para descobrir a rota usada pelo próprio site.
              js_candidates = [
                  urllib.parse.urljoin(final_url, "/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js")
              ]
              for js_url in js_candidates:
                  try:
                      with fetch(js_url) as r:
                          js_text = r.read().decode("utf-8", "ignore")
                      print("JSLEN", len(js_text))
                      for key in ("download","fetch(","api/","shareId","publicId","fileId","prepare","presign","signed"):
                          pos = 0
                          shown = 0
                          low = js_text.lower()
                          while shown < 30:
                              i = low.find(key.lower(), pos)
                              if i < 0:
                                  break
                              print("JSDIAG", key, js_text[max(0,i-220):i+420])
                              pos = i + len(key)
                              shown += 1
                  except Exception as e:
                      print("JSDIAGERR", js_url, e)

              candidates = []

              # URLs absolutas embutidas no HTML/JSON da página de compartilhamento.
              for m in re.finditer(r'https?://[^"\'<>\\\s]+', text):
                  u = html.unescape(m.group(0)).replace("\\/","/")
                  if any(k in u.lower() for k in ("download", "file", "object", "storage", ".jpg", ".jpeg", ".png", ".webp")):
                      candidates.append(u)

              # href/src relativos.
              for m in re.finditer(r'(?:href|src)=["\']([^"\']+)["\']', text, re.I):
                  u = html.unescape(m.group(1))
                  if any(k in u.lower() for k in ("download", "file", ".jpg", ".jpeg", ".png", ".webp")):
                      candidates.append(urllib.parse.urljoin(final_url, u))

              # Ignora recursos estáticos da interface (logos, ícones etc.).
              candidates = [u for u in candidates if "/_next/static/" not in u]

              print("Candidatos encontrados:")
              for u in candidates[:100]:
                  print("  ", u)

              seen = set()
              best = None
              best_url = None
              for u in candidates:
                  if u in seen:
                      continue
                  seen.add(u)
                  try:
                      with fetch(u) as r:
                          b = r.read()
                          ct = (r.headers.get("Content-Type") or "").lower()
                      if ct.startswith("image/") and len(b) > 10000:
                          if best is None or len(b) > len(best):
                              best = b
                              best_url = u
                  except Exception:
                      pass

              if best is not None:
                  target.write_bytes(best)
                  print(f"Origem escolhida: {best_url} ({len(best)} bytes)")
                  return

              raise RuntimeError(f"Não foi possível localizar o arquivo de imagem na página compartilhada: {url}")

          for item in photos:
              url = item["url"]
              name = pathlib.Path(item["filename"]).name
              target = out / name
              resolve_and_download(url, target)
              if target.stat().st_size < 10000:
                  raise RuntimeError(f"Arquivo muito pequeno ou inválido: {name}")
              print(f"{name}: {target.stat().st_size} bytes")
          PY

      - name: Criar pacote de assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf assets/site-festa-fotos.tar.gz public/site-photos

      - name: Versionar fotos e pacote
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/uploads
          cp -f public/site-photos/* assets/uploads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-festa-fotos.tar.gz assets/uploads public/site-photos
          if git diff --cached --quiet; then
            echo "Fotos já estão atualizadas."
          else
            git commit -m "Atualiza fotos do site em alta resolução"
            git push
          fi

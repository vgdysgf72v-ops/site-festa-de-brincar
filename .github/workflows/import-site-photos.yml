name: Importar fotos do site

on:
  push:
    branches: [main]
    paths:
      - "content/photo-import.json"
      - ".github/workflows/import-site-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar fotos originais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/site-photos
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, re

          API = "https://api.firestorage.ai/dev/file"
          manifest = pathlib.Path("content/photo-import.json")
          data = json.loads(manifest.read_text())
          photos = data.get("photos", [])
          if not photos:
              raise SystemExit("Nenhuma foto para importar.")

          out = pathlib.Path("public/site-photos")

          def request(url, method="GET", body=None, headers=None):
              h = {
                  "User-Agent": "Mozilla/5.0 Festa-de-Brincar-importer/1.0",
                  "Accept": "*/*",
              }
              if headers:
                  h.update(headers)
              data = None
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  h["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              return urllib.request.urlopen(req, timeout=90)

          def find_url(obj):
              if isinstance(obj, str):
                  return obj if obj.startswith("http://") or obj.startswith("https://") else None
              if isinstance(obj, dict):
                  preferred = ("downloadUrl","download_url","url","signedUrl","signed_url")
                  for k in preferred:
                      v = obj.get(k)
                      if isinstance(v, str) and v.startswith(("http://","https://")):
                          return v
                  for v in obj.values():
                      u = find_url(v)
                      if u:
                          return u
              if isinstance(obj, list):
                  for v in obj:
                      u = find_url(v)
                      if u:
                          return u
              return None

          def download_firestorage(share_url, target):
              m = re.search(r'/f/([A-Za-z0-9_-]+)', urllib.parse.urlparse(share_url).path)
              if not m:
                  raise RuntimeError(f"URL de compartilhamento inválida: {share_url}")
              share_id = m.group(1)

              with request(f"{API}/shares/{share_id}/files?maxResults=1000") as r:
                  meta = json.loads(r.read().decode("utf-8"))

              files = meta.get("files") or []
              if not files:
                  raise RuntimeError("Nenhum arquivo encontrado no compartilhamento.")

              # Prefere o maior arquivo, evitando thumbnails/previews.
              f = max(files, key=lambda x: int(x.get("sizeBytes") or 0))
              file_id = f.get("fileId")
              if not file_id:
                  raise RuntimeError("fileId não encontrado.")

              with request(f"{API}/shares/{share_id}/files/{file_id}/download", method="POST") as r:
                  info = json.loads(r.read().decode("utf-8"))

              download_url = find_url(info)
              if not download_url:
                  raise RuntimeError(f"URL de download não encontrada na resposta: {info}")

              with request(download_url) as r:
                  body = r.read()
                  ctype = (r.headers.get("Content-Type") or "").lower()

              if len(body) < 10000:
                  raise RuntimeError("Arquivo baixado é muito pequeno.")
              if "text/html" in ctype:
                  raise RuntimeError("Download retornou HTML em vez da imagem.")

              target.write_bytes(body)
              print(f"{target.name}: {len(body)} bytes; origem={f.get('fileName')}")

          for item in photos:
              name = pathlib.Path(item["filename"]).name
              target = out / name
              download_firestorage(item["url"], target)
          PY

      - name: Criar pacote de assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf assets/site-festa-fotos.tar.gz public/site-photos

      - name: Versionar fotos e pacote
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/uploads
          cp -f public/site-photos/* assets/uploads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-festa-fotos.tar.gz assets/uploads public/site-photos
          if git diff --cached --quiet; then
            echo "Fotos já estão atualizadas."
          else
            git commit -m "Atualiza fotos do site em alta resolução"
            git push
          fi

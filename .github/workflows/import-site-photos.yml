name: Importar fotos do site

on:
  push:
    branches: [main]
    paths:
      - "content/photo-import.json"
      - ".github/workflows/import-site-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar fotos originais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/site-photos
          python - <<'PY'
          import json, pathlib, urllib.request
          manifest = pathlib.Path("content/photo-import.json")
          if not manifest.exists():
              raise SystemExit("Manifesto não encontrado.")
          data = json.loads(manifest.read_text())
          photos = data.get("photos", [])
          if not photos:
              raise SystemExit("Nenhuma foto para importar.")
          out = pathlib.Path("public/site-photos")
          for item in photos:
              url = item["url"]
              name = pathlib.Path(item["filename"]).name
              target = out / name
              req = urllib.request.Request(url, headers={"User-Agent":"Festa-de-Brincar-importer/1.0"})
              with urllib.request.urlopen(req, timeout=90) as r, target.open("wb") as f:
                  f.write(r.read())
              if target.stat().st_size < 10000:
                  raise RuntimeError(f"Arquivo muito pequeno ou inválido: {name}")
          PY

      - name: Criar pacote de assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf assets/site-festa-fotos.tar.gz public/site-photos

      - name: Versionar pacote
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-festa-fotos.tar.gz
          if git diff --cached --quiet; then
            echo "Pacote já está atualizado."
          else
            git commit -m "Atualiza fotos do site"
            git push
          fi
